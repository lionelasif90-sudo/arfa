services:
  - type: worker
    name: aarfa-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m tg_bot
    envVars:
      - key: ENV
        value: "1"
      - key: TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: DATABASE_URL
        sync: false
